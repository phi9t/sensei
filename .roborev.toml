agent = "gemini"
snapshot_dir = ".roborev"
review_guidelines_supersede_global = false

review_guidelines = """
Treat AGENTS.md, the referenced Kata issue, and the approved spec as binding.

Prioritize:
1. Correctness and specification violations.
2. Security, authorization, prompt-injection, secret, and path-handling risks.
3. Data loss, race conditions, deadlocks, resource leaks, and failure recovery.
4. API, persistence, serialization, and backward-compatibility contracts.
5. Missing regression tests for changed behavior.
6. Performance regressions in identified hot paths.
7. Unnecessary scope, duplicated mechanisms, and unrequested refactoring.

A passing test suite does not override a semantic defect.
Do not block solely on subjective style already enforced by deterministic tooling.
Identify exact files, symbols, failure scenarios, and severity.
"""

[kata_context]
mode = "current"
max_chars = 50000

[[hooks]]
event = "review.*"
type = "kata"
labels = ["roborev", "from-review"]
priority = 1
